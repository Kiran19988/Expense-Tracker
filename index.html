<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- --- NEW: Theme Toggle and Settings --- -->
    <div class="header-controls">
        <button id="settings-btn" class="icon-btn" title="Manage Categories">⚙️</button>
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="theme-checkbox">
                <input type="checkbox" id="theme-checkbox" />
                <div class="slider round"></div>
            </label>
        </div>
    </div>

    <div class="container">
        <h1>Expense & Income Tracker</h1>

        <!-- --- MODIFIED: Tabbed interface for Expense/Income --- -->
        <div class="form-container card">
            <div class="tab-buttons">
                <button class="tab-btn active" data-form="expense">Add Expense</button>
                <button class="tab-btn" data-form="income">Add Income</button>
            </div>

            <!-- Expense Input/Edit Form -->
            <form id="expense-form" class="transaction-form active">
                <h2 id="form-title">Add a New Expense</h2>
                <input type="hidden" id="expense-id">
                <div class="form-control">
                    <label for="expense-date">Date</label>
                    <input type="date" id="expense-date" required>
                </div>
                <div class="form-control">
                    <label for="expense-category">Category</label>
                    <select id="expense-category" required></select> <!-- Dynamically populated -->
                </div>
                <div class="form-control">
                    <label for="expense-desc">Description</label>
                    <input type="text" id="expense-desc" placeholder="e.g., Lunch with colleagues" required>
                </div>
                <div class="form-control">
                    <label for="expense-amount">Amount (₹)</label>
                    <input type="number" id="expense-amount" placeholder="e.g., 45.50" step="0.01" min="0" required>
                </div>
                <button type="submit" class="btn" id="submit-expense-btn">Add Expense</button>
            </form>

            <!-- --- NEW: Income Input Form --- -->
            <form id="income-form" class="transaction-form">
                <h2 id="income-form-title">Add a New Income</h2>
                <input type="hidden" id="income-id">
                 <div class="form-control">
                    <label for="income-date">Date</label>
                    <input type="date" id="income-date" required>
                </div>
                <div class="form-control">
                    <label for="income-desc">Description (e.g., Salary, Freelance)</label>
                    <input type="text" id="income-desc" placeholder="e.g., Monthly Salary" required>
                </div>
                <div class="form-control">
                    <label for="income-amount">Amount (₹)</label>
                    <input type="number" id="income-amount" placeholder="e.g., 50000" step="0.01" min="0" required>
                </div>
                <button type="submit" class="btn" id="submit-income-btn">Add Income</button>
            </form>
        </div>

        <!-- Transaction List -->
        <div class="card">
            <h2>Transactions</h2>
            <div class="filter-controls">
                <div class="form-control">
                    <label for="filter-start-date">From</label>
                    <input type="date" id="filter-start-date">
                </div>
                <div class="form-control">
                    <label for="filter-end-date">To</label>
                    <input type="date" id="filter-end-date">
                </div>
                <button id="filter-btn" class="btn filter-btn">Filter</button>
                <button id="reset-filter-btn" class="btn filter-btn reset-btn">Reset</button>
            </div>
             <!-- --- NEW: Export Button --- -->
            <button id="export-csv-btn" class="btn export-btn">Export to CSV</button>
            <ul id="transaction-list">
                <!-- Transactions will be added here -->
            </ul>
        </div>
        
        <!-- --- NEW: Summary Card --- -->
        <div id="summary-card" class="card summary-card">
            <h3>Summary for Selected Period</h3>
            <div class="summary-grid">
                <div>
                    <p>Total Income</p>
                    <span id="summary-income" class="income-color">₹0.00</span>
                </div>
                <div>
                    <p>Total Expenses</p>
                    <span id="summary-expenses" class="expense-color">₹0.00</span>
                </div>
                <div>
                    <p>Balance</p>
                    <span id="summary-balance">₹0.00</span>
                </div>
            </div>
        </div>


        <!-- Chart and Analysis -->
        <div class="card">
            <div class="card-header">
                <h2>Expense Breakdown</h2>
                <div class="chart-options">
                    <label for="chart-type-select">Chart Type:</label>
                    <select id="chart-type-select">
                        <option value="pie">Pie</option>
                        <option value="bar">Bar</option>
                        <option value="doughnut">Doughnut</option>
                    </select>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="expense-chart"></canvas>
            </div>
        </div>

        <!-- --- NEW: Trend Chart --- -->
        <div class="card">
             <div class="card-header">
                <h2>Monthly Trends</h2>
            </div>
            <div class="chart-container">
                <canvas id="trend-chart"></canvas>
            </div>
        </div>

    </div>

    <!-- --- NEW: Category Management Modal --- -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">×</span>
            <h2>Manage Categories</h2>
            <div id="category-list">
                <!-- Categories will be listed here -->
            </div>
            <form id="add-category-form">
                <input type="text" id="new-category-name" placeholder="New category name" required>
                <button type="submit" class="btn">Add Category</button>
            </form>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
