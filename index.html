                            <div className="value positive">{formatCurrency(monthlyData.income)}</div>
                            {previousMonthData.income > 0 && (
                                <div className={`trend ${incomeChange >= 0 ? 'up' : 'down'}`}>
                                    {incomeChange >= 0 ? '↑' : '↓'} {Math.abs(incomeChange).toFixed(1)}% vs last month
                                </div>
                            )}
                        </div>
                        <div className="summary-card">
                            <div className="icon">💸</div>
                            <div className="label">Monthly Expenses</div>
                            <div className="value negative">{formatCurrency(monthlyData.expense)}</div>
                            {previousMonthData.expense > 0 && (
                                <div className={`trend ${expenseChange <= 0 ? 'up' : 'down'}`}>
                                    {expenseChange >= 0 ? '↑' : '↓'} {Math.abs(expenseChange).toFixed(1)}% vs last month
                                </div>
                            )}
                        </div>
                        <div className="summary-card">
                            <div className="icon">💰</div>
                            <div className="label">Net Savings</div>
                            <div className={`value ${monthlyData.balance >= 0 ? 'positive' : 'negative'}`}>
                                {formatCurrency(monthlyData.balance)}
                            </div>
                            <div className="trend">
                                {monthlyData.income > 0 
                                    ? `${((monthlyData.balance / monthlyData.income) * 100).toFixed(1)}% savings rate`
                                    : 'No income this month'
                                }
                            </div>
                        </div>
                        <div className="summary-card">
                            <div className="icon">📊</div>
                            <div className="label">Transactions</div>
                            <div className="value">{monthlyData.transactions}</div>
                            <div className="trend">
                                Avg {formatCurrency(monthlyData.avgDailyExpense)}/day spent
                            </div>
                        </div>
                    </div>

                    {/* NEW: Charts */}
                    {monthlyData.transactions > 0 && (
                        <div className="main-grid">
                            <div className="chart-box">
                                <h3>📈 Daily Trend</h3>
                                <ChartComponent 
                                    type="line" 
                                    data={monthlyData.chartData.daily} 
                                    darkMode={darkMode}
                                    options={{
                                        scales: {
                                            y: { beginAtZero: true }
                                        }
                                    }}
                                />
                            </div>
                            <div className="chart-box">
                                <h3>🍩 Expense Categories</h3>
                                {monthlyData.categoryBreakdown.length > 0 ? (
                                    <ChartComponent 
                                        type="doughnut" 
                                        data={monthlyData.chartData.categories}
                                        darkMode={darkMode}
                                        options={{
                                            cutout: '70%',
                                            plugins: {
                                                legend: { position: 'bottom' }
                                            }
                                        }}
                                    />
                                ) : (
                                    <p className="no-data">No expenses to display</p>
                                )}
                            </div>
                        </div>
                    )}

                    {monthlyData.categoryBreakdown.length > 0 && (
                        <div className="comparison-grid">
                            <div className="category-breakdown">
                                <h3>📦 Top Expenses</h3>
                                {monthlyData.categoryBreakdown.slice(0, 6).map(item => (
                                    <div key={item.category} className="category-item">
                                        <div className="category-icon">{item.info.icon}</div>
                                        <div className="category-info">
                                            <div className="category-name">{item.info.label}</div>
                                            <div className="category-count">{item.percentage.toFixed(1)}% of expenses</div>
                                        </div>
                                        <div className="category-amount">
                                            <div>{formatCurrency(item.amount)}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="comparison-card">
                                <h3>📉 Insights</h3>
                                <div className="comparison-item">
                                    <span className="label">Avg. Daily Income</span>
                                    <span className="value" style={{ color: 'var(--income-color)' }}>
                                        {formatCurrency(monthlyData.avgDailyIncome)}
                                    </span>
                                </div>
                                <div className="comparison-item">
                                    <span className="label">Avg. Daily Expense</span>
                                    <span className="value" style={{ color: 'var(--expense-color)' }}>
                                        {formatCurrency(monthlyData.avgDailyExpense)}
                                    </span>
                                </div>
                                <div className="comparison-item">
                                    <span className="label">Days in Month</span>
                                    <span className="value">{monthlyData.daysInMonth}</span>
                                </div>
                                <div className="comparison-item">
                                    <span className="label">Net Result</span>
                                    <span className="value" style={{ color: monthlyData.balance >= 0 ? 'var(--income-color)' : 'var(--expense-color)' }}>
                                        {monthlyData.balance >= 0 ? 'Surplus' : 'Deficit'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    )}

                    {monthlyData.transactions === 0 && (
                        <div className="no-data">
                            <div className="no-data-icon">📭</div>
                            <h4>No transactions for {FULL_MONTH_NAMES[selectedMonth]} {selectedYear}</h4>
                            <p>Add some transactions to see your monthly analysis</p>
                        </div>
                    )}
                </div>
            );
        };

        // ==================== YEARLY ANALYSIS COMPONENT ====================
        const YearlyAnalysis = ({ transactions, selectedYear, setSelectedYear, darkMode }) => {
            const yearlyData = useMemo(() => {
                const filtered = transactions.filter(t => {
                    const date = new Date(t.date);
                    return date.getFullYear() === selectedYear;
                });

                let totalIncome = 0;
                let totalExpense = 0;
                const monthlyBreakdown = Array(12).fill(null).map(() => ({
                    income: 0,
                    expense: 0,
                    balance: 0
                }));
                const categoryBreakdown = {};

                filtered.forEach(t => {
                    const month = new Date(t.date).getMonth();
                    
                    if (t.type === 'income') {
                        totalIncome += t.amount;
                        monthlyBreakdown[month].income += t.amount;
                    } else {
                        totalExpense += t.amount;
                        monthlyBreakdown[month].expense += t.amount;
                        
                        if (!categoryBreakdown[t.category]) {
                            categoryBreakdown[t.category] = 0;
                        }
                        categoryBreakdown[t.category] += t.amount;
                    }
                });

                monthlyBreakdown.forEach(m => {
                    m.balance = m.income - m.expense;
                });

                const categoryArray = Object.entries(categoryBreakdown)
                    .map(([category, amount]) => ({
                        category,
                        amount,
                        percentage: totalExpense > 0 ? (amount / totalExpense) * 100 : 0,
                        info: getCategoryInfo(category, 'expense')
                    }))
                    .sort((a, b) => b.amount - a.amount);

                const avgMonthlyIncome = totalIncome / 12;
                const avgMonthlyExpense = totalExpense / 12;
                
                const bestMonth = monthlyBreakdown.reduce((best, month, index) => {
                    if (month.balance > (monthlyBreakdown[best]?.balance || -Infinity)) {
                        return index;
                    }
                    return best;
                }, 0);

                const worstMonth = monthlyBreakdown.reduce((worst, month, index) => {
                    if (month.balance < (monthlyBreakdown[worst]?.balance || Infinity)) {
                        return index;
                    }
                    return worst;
                }, 0);

                // Prepare Chart Data
                const chartData = {
                    monthly: {
                        labels: MONTH_NAMES,
                        datasets: [
                            {
                                label: 'Income',
                                data: monthlyBreakdown.map(m => m.income),
                                backgroundColor: '#28a745',
                                borderRadius: 4
                            },
                            {
                                label: 'Expenses',
                                data: monthlyBreakdown.map(m => m.expense),
                                backgroundColor: '#dc3545',
                                borderRadius: 4
                            }
                        ]
                    },
                    categories: {
                        labels: categoryArray.map(c => c.info.label),
                        datasets: [{
                            data: categoryArray.map(c => c.amount),
                            backgroundColor: CHART_COLORS,
                            borderWidth: 1
                        }]
                    }
                };

                return {
                    totalIncome,
                    totalExpense,
                    balance: totalIncome - totalExpense,
                    transactions: filtered.length,
                    monthlyBreakdown,
                    categoryBreakdown: categoryArray,
                    avgMonthlyIncome,
                    avgMonthlyExpense,
                    bestMonth,
                    worstMonth,
                    savingsRate: totalIncome > 0 ? ((totalIncome - totalExpense) / totalIncome) * 100 : 0,
                    chartData
                };
            }, [transactions, selectedYear]);

            // Get previous year data for comparison
            const previousYearData = useMemo(() => {
                const filtered = transactions.filter(t => {
                    const date = new Date(t.date);
                    return date.getFullYear() === selectedYear - 1;
                });

                let income = 0;
                let expense = 0;

                filtered.forEach(t => {
                    if (t.type === 'income') {
                        income += t.amount;
                    } else {
                        expense += t.amount;
                    }
                });

                return { income, expense, balance: income - expense };
            }, [transactions, selectedYear]);

            const calculateChange = (current, previous) => {
                if (previous === 0) return current > 0 ? 100 : 0;
                return ((current - previous) / previous) * 100;
            };

            const incomeChange = calculateChange(yearlyData.totalIncome, previousYearData.income);
            const expenseChange = calculateChange(yearlyData.totalExpense, previousYearData.expense);

            return (
                <div className="analysis-section">
                    <div className="analysis-header">
                        <h2>📆 Year {selectedYear} Overview</h2>
                        <div className="period-selector">
                            <div className="period-nav">
                                <button onClick={() => setSelectedYear(selectedYear - 1)}>◀</button>
                                <button onClick={() => setSelectedYear(selectedYear + 1)}>▶</button>
                            </div>
                            <select 
                                value={selectedYear} 
                                onChange={(e) => setSelectedYear(parseInt(e.target.value))}
                            >
                                {[...Array(10)].map((_, i) => {
                                    const year = new Date().getFullYear() - 5 + i;
                                    return <option key={year} value={year}>{year}</option>;
                                })}
                            </select>
                        </div>
                    </div>

                    <div className="summary-cards">
                        <div className="summary-card">
                            <div className="icon">💵</div>
                            <div className="label">Yearly Income</div>
                            <div className="value positive">{formatCurrency(yearlyData.totalIncome)}</div>
                            {previousYearData.income > 0 && (
                                <div className={`trend ${incomeChange >= 0 ? 'up' : 'down'}`}>
                                    {incomeChange >= 0 ? '↑' : '↓'} {Math.abs(incomeChange).toFixed(1)}% vs {selectedYear - 1}
                                </div>
                            )}
                        </div>
                        <div className="summary-card">
                            <div className="icon">💸</div>
                            <div className="label">Yearly Expenses</div>
                            <div className="value negative">{formatCurrency(yearlyData.totalExpense)}</div>
                            {previousYearData.expense > 0 && (
                                <div className={`trend ${expenseChange <= 0 ? 'up' : 'down'}`}>
                                    {expenseChange >= 0 ? '↑' : '↓'} {Math.abs(expenseChange).toFixed(1)}% vs {selectedYear - 1}
                                </div>
                            )}
                        </div>
                        <div className="summary-card">
                            <div className="icon">💰</div>
                            <div className="label">Net Savings</div>
                            <div className={`value ${yearlyData.balance >= 0 ? 'positive' : 'negative'}`}>
                                {formatCurrency(yearlyData.balance)}
                            </div>
                            <div className="trend">
                                {yearlyData.savingsRate.toFixed(1)}% savings rate
                            </div>
                        </div>
                        <div className="summary-card">
                            <div className="icon">📊</div>
                            <div className="label">Avg Monthly</div>
                            <div className="value">{formatCurrency(yearlyData.avgMonthlyExpense)}</div>
                            <div className="trend">
                                spent per month
                            </div>
                        </div>
                    </div>

                    {/* NEW: Charts */}
                    {yearlyData.transactions > 0 && (
                        <div className="main-grid">
                            <div className="chart-box">
                                <h3>📊 Income vs Expense</h3>
                                <ChartComponent 
                                    type="bar" 
                                    data={yearlyData.chartData.monthly} 
                                    darkMode={darkMode}
                                    options={{
                                        scales: {
                                            y: { beginAtZero: true }
                                        }
                                    }}
                                />
                            </div>
                            <div className="chart-box">
                                <h3>🍩 Category Breakdown</h3>
                                {yearlyData.categoryBreakdown.length > 0 ? (
                                    <ChartComponent 
                                        type="doughnut" 
                                        data={yearlyData.chartData.categories}
                                        darkMode={darkMode}
                                        options={{
                                            cutout: '70%',
                                            plugins: {
                                                legend: { position: 'bottom' }
                                            }
                                        }}
                                    />
                                ) : (
                                    <p className="no-data">No expenses to display</p>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Year Overview - Month Boxes */}
                    <div className="chart-box">
                        <h3>🗓️ Monthly Balances</h3>
                        <div className="year-overview">
                            {yearlyData.monthlyBreakdown.map((month, index) => (
                                <div 
                                    key={index} 
                                    className={`month-box ${index === yearlyData.bestMonth ? 'active' : ''}`}
                                    title={`${FULL_MONTH_NAMES[index]}: Income ${formatCurrency(month.income)}, Expense ${formatCurrency(month.expense)}`}
                                >
                                    <div className="month-name">{MONTH_NAMES[index]}</div>
                                    <div className={`month-total ${month.balance >= 0 ? 'positive' : 'negative'}`}>
                                        {month.balance >= 0 ? '+' : ''}{formatCurrency(month.balance)}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {yearlyData.categoryBreakdown.length > 0 && (
                        <div className="comparison-grid">
                            <div className="category-breakdown">
                                <h3>📦 Top Expense Categories</h3>
                                {yearlyData.categoryBreakdown.slice(0, 6).map(item => (
                                    <div key={item.category} className="category-item">
                                        <div className="category-icon">{item.info.icon}</div>
                                        <div className="category-info">
                                            <div className="category-name">{item.info.label}</div>
                                            <div className="category-count">{item.percentage.toFixed(1)}% of yearly expenses</div>
                                        </div>
                                        <div className="category-amount">
                                            <div>{formatCurrency(item.amount)}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="comparison-card">
                                <h3>🏆 Year Highlights</h3>
                                <div className="comparison-item">
                                    <span className="label">Best Month</span>
                                    <span className="value" style={{ color: 'var(--income-color)' }}>
                                        {FULL_MONTH_NAMES[yearlyData.bestMonth]}
                                    </span>
                                </div>
                                <div className="comparison-item">
                                    <span className="label">Worst Month</span>
                                    <span className="value" style={{ color: 'var(--expense-color)' }}>
                                        {FULL_MONTH_NAMES[yearlyData.worstMonth]}
                                    </span>
                                </div>
                                <div className="comparison-item">
                                    <span className="label">Avg Monthly Income</span>
                                    <span className="value">
                                        {formatCurrency(yearlyData.avgMonthlyIncome)}
                                    </span>
                                </div>
                                <div className="comparison-item">
                                    <span className="label">Avg Monthly Expense</span>
                                    <span className="value">
                                        {formatCurrency(yearlyData.avgMonthlyExpense)}
                                    </span>
                                </div>
                                <div className="comparison-item">
                                    <span className="label">Savings Rate</span>
                                    <span className="value">
                                        <span className={`trend-indicator ${yearlyData.savingsRate >= 0 ? 'positive' : 'negative'}`}>
                                            {yearlyData.savingsRate.toFixed(1)}%
                                        </span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    )}

                    {yearlyData.transactions === 0 && (
                        <div className="no-data">
                            <div className="no-data-icon">📭</div>
                            <h4>No transactions for {selectedYear}</h4>
                            <p>Add some transactions to see your yearly analysis</p>
                        </div>
                    )}
                </div>
            );
        };

        // ==================== COMBINED ANALYSIS COMPONENT ====================
        const AnalysisSection = ({ transactions, darkMode }) => {
            const [activeTab, setActiveTab] = useState('monthly');
            const currentDate = new Date();
            const [selectedMonth, setSelectedMonth] = useState(currentDate.getMonth());
            const [selectedYear, setSelectedYear] = useState(currentDate.getFullYear());

            return (
                <div className="analysis-section">
                    <div className="card">
                        <div className="card-header">
                            <h2>📊 Financial Analysis</h2>
                            <div className="analysis-tabs">
                                <button 
                                    className={`analysis-tab ${activeTab === 'monthly' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('monthly')}
                                >
                                    📅 Monthly
                                </button>
                                <button 
                                    className={`analysis-tab ${activeTab === 'yearly' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('yearly')}
                                >
                                    📆 Yearly
                                </button>
                            </div>
                        </div>
                        <div className="card-body">
                            {activeTab === 'monthly' ? (
                                <MonthlyAnalysis 
                                    transactions={transactions}
                                    selectedMonth={selectedMonth}
                                    setSelectedMonth={setSelectedMonth}
                                    selectedYear={selectedYear}
                                    setSelectedYear={setSelectedYear}
                                    darkMode={darkMode}
                                />
                            ) : (
                                <YearlyAnalysis 
                                    transactions={transactions}
                                    selectedYear={selectedYear}
                                    setSelectedYear={setSelectedYear}
                                    darkMode={darkMode}
                                />
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ==================== MAIN APP COMPONENT ====================
        const App = () => {
            // State
            const [transactions, setTransactions] = useState([]);
            const [filters, setFilters] = useState({
                searchTerm: '',
                type: 'all',
                category: 'all'
            });
            const [editingTransaction, setEditingTransaction] = useState(null);
            const [deletingId, setDeletingId] = useState(null);
            const [toasts, setToasts] = useState([]);
            const [darkMode, setDarkMode] = useState(false);

            // Load data from localStorage on mount
            useEffect(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        setTransactions(parsed.transactions || []);
                        setDarkMode(parsed.darkMode || false);
                    }
                } catch (error) {
                    console.error('Error loading data:', error);
                }
            }, []);

            // Save data to localStorage whenever transactions or dark mode changes
            useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        transactions,
                        darkMode
                    }));
                } catch (error) {
                    console.error('Error saving data:', error);
                }
            }, [transactions, darkMode]);

            // Apply dark mode
            useEffect(() => {
                document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            }, [darkMode]);

            // Toast management
            const addToast = useCallback((message, type = 'info') => {
                const id = generateId();
                setToasts(prev => [...prev, { id, message, type }]);
            }, []);

            const removeToast = useCallback((id) => {
                setToasts(prev => prev.filter(t => t.id !== id));
            }, []);

            // Transaction handlers
            const handleAddTransaction = useCallback((transaction) => {
                setTransactions(prev => [...prev, transaction]);
            }, []);

            const handleUpdateTransaction = useCallback((updatedTransaction) => {
                setTransactions(prev => 
                    prev.map(t => t.id === updatedTransaction.id ? updatedTransaction : t)
                );
                setEditingTransaction(null);
                addToast('Transaction updated successfully!', 'success');
            }, [addToast]);

            const handleDeleteTransaction = useCallback(() => {
                setTransactions(prev => prev.filter(t => t.id !== deletingId));
                setDeletingId(null);
                addToast('Transaction deleted!', 'success');
            }, [deletingId, addToast]);

            const toggleDarkMode = useCallback(() => {
                setDarkMode(prev => !prev);
            }, []);

            return (
                <div>
                    <ToastContainer toasts={toasts} removeToast={removeToast} />
                    
                    <Header darkMode={darkMode} toggleDarkMode={toggleDarkMode} />
                    
                    <div className="container">
                        <BalanceCards transactions={transactions} />
                        
                        <div className="main-grid">
                            <div>
                                <TransactionForm 
                                    onAddTransaction={handleAddTransaction} 
                                    addToast={addToast}
                                />
                                <div style={{ marginTop: '20px' }}>
                                    <DataManagement 
                                        transactions={transactions}
                                        setTransactions={setTransactions}
                                        addToast={addToast}
                                    />
                                </div>
                            </div>
                            
                            <div className="card">
                                <div className="card-header">
                                    <h2>📋 Transaction History</h2>
                                    <span style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>
                                        {transactions.length} transaction{transactions.length !== 1 ? 's' : ''}
                                    </span>
                                </div>
                                <div className="card-body">
                                    <FilterBar 
                                        filters={filters} 
                                        setFilters={setFilters}
                                        transactions={transactions}
                                    />
                                    <TransactionList 
                                        transactions={transactions}
                                        filters={filters}
                                        onEdit={setEditingTransaction}
                                        onDelete={setDeletingId}
                                    />
                                </div>
                            </div>
                        </div>

                        <Statistics transactions={transactions} />

                        {/* NEW: Analysis Section with Charts */}
                        <AnalysisSection transactions={transactions} darkMode={darkMode} />

                        <footer className="footer">
                            <p>💰 Expense & Income Tracker © {new Date().getFullYear()}</p>
                            <p>Built with React • Data stored locally in your browser</p>
                        </footer>
                    </div>

                    {/* Edit Modal */}
                    {editingTransaction && (
                        <EditModal
                            transaction={editingTransaction}
                            onSave={handleUpdateTransaction}
                            onClose={() => setEditingTransaction(null)}
                        />
                    )}

                    {/* Delete Confirmation Modal */}
                    {deletingId && (
                        <DeleteModal
                            onConfirm={handleDeleteTransaction}
                            onClose={() => setDeletingId(null)}
                        />
                    )}
                </div>
            );
        };

        // ==================== RENDER APP ====================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
